[project]
name = "personal-trainer-agent"
version = "0.1.0"
description = "LangGraph personal trainer agent with FastAPI, RAG, and rule-based guardrails"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=0.111.0",
    "beautifulsoup4>=4.15.0",
    "biopython>=1.87",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.11",
    "langchain-anthropic>=1.4.7",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100
src = [".", "trainer", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter / docstrings
]

[tool.ruff.lint.per-file-ignores]
# Scripts adjust sys.path before importing the package.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["trainer"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
